<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172146" />
      <stop offset="100%" stop-color="#0c1126" />
    </linearGradient>
    <linearGradient id="scanGradTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="scanGradBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded dark-blue square -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#bgGrad)" stroke="#1e295d" stroke-width="2" />

  <!-- Four glowing scan-corner brackets -->
  <!-- Top-left -->
  <path d="M 23 37 L 23 27 C 23 24.5 24.5 23 27 23 L 37 23" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Top-right -->
  <path d="M 63 23 L 73 23 C 75.5 23 77 24.5 77 27 L 77 37" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Bottom-left -->
  <path d="M 23 63 L 23 73 C 23 75.5 24.5 77 27 77 L 37 77" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Bottom-right -->
  <path d="M 63 77 L 73 77 C 75.5 77 77 75.5 77 73 L 77 63" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Center horizontal dashed guide line -->
  <line x1="16" y1="50" x2="84" y2="50" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3.5 3" opacity="0.45" />

  <!-- White handwritten 7 -->
  <path d="M 33 40 L 67 40 L 48 70" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Corner dots on the 7 -->
  <circle cx="33" cy="40" r="5" fill="#38bdf8" />
  <circle cx="67" cy="40" r="5" fill="#22d3ee" />
  <circle cx="48" cy="70" r="5" fill="#c084fc" />
</svg>
